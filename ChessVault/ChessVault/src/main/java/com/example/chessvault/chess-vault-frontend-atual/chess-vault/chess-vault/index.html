<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chess Vault</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ========== AUTH SCREEN ========== -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-mark">♟</div>
      <div>
        <div class="auth-brand">Chess Vault</div>
        <div class="auth-tagline">Biblioteca pessoal de xadrez</div>
      </div>
    </div>

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Entrar</button>
      <button type="button" class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Cadastrar</button>
    </div>

    <form id="login-form" class="auth-form active">
      <div class="auth-field">
        <label class="auth-label" for="login-email">E-mail</label>
        <input class="auth-input" type="email" id="login-email" placeholder="seu@email.com" autocomplete="email" required />
      </div>
      <div class="auth-field">
        <label class="auth-label" for="login-password">Senha</label>
        <input class="auth-input" type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="auth-submit">Entrar na Vault</button>
    </form>

    <form id="register-form" class="auth-form">
      <div class="auth-field">
        <label class="auth-label" for="register-name">Nome completo</label>
        <input class="auth-input" type="text" id="register-name" placeholder="Seu nome" autocomplete="name" required />
      </div>
      <div class="auth-field">
        <label class="auth-label" for="register-email">E-mail</label>
        <input class="auth-input" type="email" id="register-email" placeholder="seu@email.com" autocomplete="email" required />
      </div>
      <div class="auth-field">
        <label class="auth-label" for="register-password">Senha</label>
        <input class="auth-input" type="password" id="register-password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required />
      </div>
      <div class="auth-field">
        <label class="auth-label" for="register-confirm-password">Confirme a senha</label>
        <input class="auth-input" type="password" id="register-confirm-password" placeholder="Repita a senha" autocomplete="new-password" required />
      </div>
      <button type="submit" class="auth-submit">Criar conta</button>
    </form>

    <p class="auth-footer">Chess Vault · biblioteca pessoal de estudo de xadrez</p>
  </div>
</div>

<!-- ========== APP SCREEN ========== -->
<div id="app-screen">

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-mark">♟</div>
        <div>
          <div class="sidebar-brand">Chess Vault</div>
          <div class="sidebar-version">v2.0</div>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-group-label">Coleção</div>
      <button class="nav-btn active" id="nav-books" onclick="navigateTo('books')">
        <span class="nav-icon">📚</span><span>Livros</span>
      </button>
      <button class="nav-btn" id="nav-videos" onclick="navigateTo('videos')">
        <span class="nav-icon">▶</span><span>Vídeos</span>
      </button>

      <div class="nav-group-label">Estudo</div>
      <button class="nav-btn" id="nav-games" onclick="navigateTo('games')">
        <span class="nav-icon">♟</span><span>Partidas</span>
      </button>
      <button class="nav-btn" id="nav-players" onclick="navigateTo('players')">
        <span class="nav-icon">👤</span><span>Jogadores</span>
      </button>
      <button class="nav-btn" id="nav-puzzles" onclick="navigateTo('puzzles')">
        <span class="nav-icon">🧩</span><span>Puzzles</span>
      </button>
      <button class="nav-btn" id="nav-openings" onclick="navigateTo('openings')">
        <span class="nav-icon">🗂</span><span>Aberturas</span>
      </button>
      <button class="nav-btn" onclick="showToast('Em breve!', 'info')">
        <span class="nav-icon">📊</span><span>Progresso</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="user-pill" onclick="handleLogout()" title="Sair">
        <div class="user-avatar" id="user-avatar">M</div>
        <div>
          <div class="user-name" id="user-name">Marcos</div>
          <div class="user-label">Sair</div>
        </div>
      </div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title" id="topbar-title">Livros</div>
      </div>
      <div class="topbar-actions">
        <button class="btn-icon" onclick="showToast('Busca em breve!', 'info')" title="Buscar">🔍</button>
        <button class="btn-icon" onclick="showToast('Filtros em breve!', 'info')" title="Filtrar">⚙</button>
        <button class="btn btn-primary" id="topbar-add-btn">
          <span id="add-label">+ Adicionar livro</span>
        </button>
      </div>
    </div>

    <!-- Conteúdo normal: livros, vídeos, jogadores, puzzles, aberturas, lista de partidas -->
    <div class="content-area" id="content-area"></div>

    <!-- Detalhe de jogador -->
    <div id="player-detail-screen" class="content-area" style="display:none">
      <div class="viewer-header">
        <button class="viewer-back" onclick="closePlayerDetail()">← Voltar para Jogadores</button>
      </div>
      <div id="player-detail-body"></div>
    </div>

    <!-- Viewer de partida (tabuleiro interativo lance a lance) -->
    <div id="game-viewer" class="content-area" style="display:none">
      <div class="viewer-header">
        <button class="viewer-back" onclick="closeViewer()">← Voltar para Partidas</button>
        <div>
          <div class="viewer-game-title" id="vg-title">Partida</div>
          <div class="section-subtitle" id="vg-sub"></div>
        </div>
      </div>
      <div class="viewer-layout">
        <div class="viewer-board-col">
          <div id="chess-board-wrap">
            <div id="vboard-ranks"></div>
            <div id="vboard"></div>
          </div>
          <div id="vboard-files"></div>
          <div class="viewer-controls">
            <button class="ctrl-btn" id="btn-start" onclick="goToMove(0)" title="Início">⏮</button>
            <button class="ctrl-btn" id="btn-prev"  onclick="prevMove()"   title="Anterior">◀</button>
            <span id="move-counter">0 / 0</span>
            <button class="ctrl-btn" id="btn-next"  onclick="nextMove()"   title="Próximo">▶</button>
            <button class="ctrl-btn" id="btn-end"   onclick="goToMove(-1)" title="Final">⏭</button>
          </div>
        </div>
        <div class="viewer-moves-col">
          <div class="moves-panel">
            <div class="moves-panel-header">Movimentos</div>
            <div id="moves-info" style="padding:var(--sp-4);border-bottom:1px solid var(--border);"></div>
            <div class="moves-list"><table class="moves-table" id="moves-table"></table></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ========== MODAL: ADICIONAR JOGADOR ========== -->
<div class="modal-overlay" id="add-player-overlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Adicionar jogador</div>
      <button class="btn-icon" onclick="closeAddPlayerModal()">✕</button>
    </div>
    <form id="add-player-form">
      <div class="modal-body">
        <div class="input-group" style="margin-bottom:var(--sp-4);">
          <label class="input-label" for="player-name-input">Nome</label>
          <input class="input" type="text" id="player-name-input" placeholder="Nome do jogador" required />
        </div>
        <div class="input-group" style="margin-bottom:var(--sp-4);">
          <label class="input-label" for="player-country-input">País</label>
          <input class="input" type="text" id="player-country-input" placeholder="País" />
        </div>
        <div class="input-group" style="margin-bottom:var(--sp-4);">
          <label class="input-label" for="player-rating-input">Rating FIDE</label>
          <input class="input" type="number" id="player-rating-input" placeholder="2500" />
        </div>
        <div class="input-group" style="margin-bottom:var(--sp-4);">
          <label class="input-label" for="player-style-input">Estilo de jogo</label>
          <input class="input" type="text" id="player-style-input" placeholder="Ex: Tático — Atacante Dinâmico" />
        </div>

        <div class="tabs" style="margin-bottom:var(--sp-3);">
          <button type="button" class="tab-btn player-photo-tab active" data-tab="default" onclick="switchPlayerPhotoTab('default')">Avatar padrão</button>
          <button type="button" class="tab-btn player-photo-tab" data-tab="search" onclick="switchPlayerPhotoTab('search')">Buscar imagem</button>
        </div>

        <div id="photo-default-panel">
          <div class="avatar-gallery" id="avatar-gallery"></div>
        </div>
        <div id="photo-search-panel" style="display:none">
          <div class="search-wrap" style="margin-bottom:var(--sp-3);">
            <span class="search-icon">🔍</span>
            <input class="input" type="text" id="player-photo-search" placeholder="Buscar por nome do jogador..." />
          </div>
          <button type="button" class="btn btn-secondary btn-sm" onclick="searchPlayerPhotos()" style="margin-bottom:var(--sp-3);">Buscar</button>
          <div id="photo-search-results"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeAddPlayerModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Adicionar jogador</button>
      </div>
    </form>
  </div>
</div>

<div id="toast"></div>

<!-- Parser de PGN (gramática PEG, não regex) — biblioteca @mliebelt/pgn-parser vendorizada
     localmente (js/vendor/) para não depender de CDN externo. Expõe window.PgnParser. -->
<script src="js/vendor/pgn-parser.umd.js"></script>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/chess-engine.js"></script>
<script src="js/mockDataService.js"></script>
<script src="js/players.js"></script>
<script src="js/viewer.js"></script>
<script src="js/books.js"></script>
<script src="js/videos.js"></script>
<script src="js/games.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/openings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
