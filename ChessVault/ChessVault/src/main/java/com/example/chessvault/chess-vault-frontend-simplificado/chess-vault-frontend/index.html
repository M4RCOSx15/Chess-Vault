<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Vault - Login</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ========== AUTH SCREEN ========== -->
<div id="auth-screen" class="visible">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">♚</div>
      <div>
        <h1 class="auth-logo-text">Chess Vault</h1>
        <p class="auth-logo-sub">Biblioteca de Xadrez</p>
      </div>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Login</button>
      <button class="auth-tab" data-tab="register">Registrar</button>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="auth-form active">
      <div class="auth-field">
        <label class="auth-label">Email</label>
        <input id="login-email" type="email" class="auth-input" placeholder="seu@email.com" required />
      </div>
      <div class="auth-field">
        <label class="auth-label">Senha</label>
        <input id="login-password" type="password" class="auth-input" placeholder="Sua senha" required />
      </div>
      <button type="submit" class="auth-submit">Entrar</button>
    </form>

    <!-- Register Form -->
    <form id="register-form" class="auth-form">
      <div class="auth-field">
        <label class="auth-label">Nome</label>
        <input id="register-name" type="text" class="auth-input" placeholder="Seu nome completo" required />
      </div>
      <div class="auth-field">
        <label class="auth-label">Email</label>
        <input id="register-email" type="email" class="auth-input" placeholder="seu@email.com" required />
      </div>
      <div class="auth-field">
        <label class="auth-label">Senha</label>
        <input id="register-password" type="password" class="auth-input" placeholder="Mínimo 8 caracteres" required />
      </div>
      <div class="auth-field">
        <label class="auth-label">Confirmar Senha</label>
        <input id="register-confirm-password" type="password" class="auth-input" placeholder="Repita a senha" required />
      </div>
      <button type="submit" class="auth-submit">Criar Conta</button>
    </form>
  </div>
</div>

<!-- ========== HOME SCREEN (pós-login) ========== -->
<div id="app-screen" class="hidden">
  <div class="home-card">
    <h2>Bem-vindo, <span id="home-username">Usuário</span>!</h2>
    <p>Se você está vendo essa tela, o login funcionou de ponta a ponta.
       Daqui pra frente é onde o resto do Chess Vault (partidas, tabuleiro, etc.) vai entrar.</p>
    <button id="logout-btn" class="btn btn-secondary">Sair</button>
  </div>
</div>

<!-- Toast Notification -->
<div id="toast"></div>

<!-- Scripts -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>

</body>
</html>
