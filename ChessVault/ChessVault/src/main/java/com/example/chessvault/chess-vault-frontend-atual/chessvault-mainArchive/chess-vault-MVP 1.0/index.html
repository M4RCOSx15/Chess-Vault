<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Vault - Login</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ========== AUTH SCREEN ========== -->
<div id="auth-screen" class="visible">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">♚</div>
      <div>
        <h1 class="auth-logo-text">Chess Vault</h1>
        <p class="auth-logo-sub">Biblioteca de Xadrez</p>
      </div>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Login</button>
      <button class="auth-tab" data-tab="register">Registrar</button>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="auth-form active">
      <div class="auth-field">
        <label class="auth-label">Email</label>
        <input id="login-email" type="email" class="auth-input" placeholder="seu@email.com" required />
      </div>
      <div class="auth-field">
        <label class="auth-label">Senha</label>
        <input id="login-password" type="password" class="auth-input" placeholder="Sua senha" required />
      </div>
      <button type="submit" class="auth-submit">Entrar</button>
    </form>

    <!-- Register Form -->
    <form id="register-form" class="auth-form">
      <div class="auth-field">
        <label class="auth-label">Nome</label>
        <input id="register-name" type="text" class="auth-input" placeholder="Seu nome completo" required />
      </div>
      <div class="auth-field">
        <label class="auth-label">Email</label>
        <input id="register-email" type="email" class="auth-input" placeholder="seu@email.com" required />
      </div>
      <div class="auth-field">
        <label class="auth-label">Senha</label>
        <input id="register-password" type="password" class="auth-input" placeholder="Mínimo 8 caracteres" required />
      </div>
      <div class="auth-field">
        <label class="auth-label">Confirmar Senha</label>
        <input id="register-confirm-password" type="password" class="auth-input" placeholder="Repita a senha" required />
      </div>
      <button type="submit" class="auth-submit">Criar Conta</button>
    </form>
  </div>
</div>

<!-- ========== APP SCREEN (pós-login) ========== -->
<div id="app-screen" class="hidden">
  <aside class="sidebar">
    <header class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">♚</div>
        <div>
          <h1 class="sidebar-logo-text">Chess Vault</h1>
          <p class="sidebar-logo-sub">Beta</p>
        </div>
      </div>
    </header>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Estudo</div>
      <button class="nav-item active" data-section="dashboard">
        <span class="nav-item-icon">📊</span><span>Dashboard</span>
      </button>
      <button class="nav-item" data-section="games">
        <span class="nav-item-icon">♞</span><span>Minhas Partidas</span>
      </button>

      <div class="nav-section-label">Conta</div>
      <button class="nav-item" data-section="logout">
        <span class="nav-item-icon">🚪</span><span>Sair</span>
      </button>
    </nav>

    <footer class="sidebar-footer">
      <div class="user-pill">
        <div class="user-avatar" id="user-avatar">U</div>
        <div>
          <div class="user-name" id="user-name">Usuário</div>
          <div class="user-role">Jogador</div>
        </div>
      </div>
    </footer>
  </aside>

  <main>
    <header class="topbar">
      <h2 class="topbar-title" id="topbar-title">Dashboard</h2>
    </header>

    <div class="content-area">
      <!-- Dashboard -->
      <section id="dashboard-section" data-section-content>
        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-label">Total de Partidas</div>
            <div class="stat-value" id="stat-total-games">0</div>
          </div>
        </div>
      </section>

      <!-- Minhas Partidas -->
      <section id="games-section" data-section-content style="display:none;">
        <div class="section-header">
          <h2 class="section-title">Minhas Partidas</h2>
          <button id="new-game-btn" class="btn btn-primary">+ Nova Partida</button>
        </div>
        <div id="games-list">
          <!-- Carregado via API -->
        </div>
      </section>

      <!-- Visualizador de Partida -->
      <section id="viewer-section" data-section-content style="display:none;">
        <div class="viewer-header">
          <button class="viewer-back" id="viewer-back-btn">← Voltar para Partidas</button>
          <div class="viewer-game-title" id="viewer-title">Partida</div>
        </div>
        <div class="viewer-layout">
          <div class="viewer-board-col">
            <div id="chess-board-wrap">
              <div id="vboard-ranks"></div>
              <div id="vboard"></div>
            </div>
            <div id="vboard-files"></div>
            <div class="viewer-controls">
              <button class="ctrl-btn" id="btn-start" title="Início">⏮</button>
              <button class="ctrl-btn" id="btn-prev" title="Anterior">◀</button>
              <span id="move-counter">0 / 0</span>
              <button class="ctrl-btn" id="btn-next" title="Próximo">▶</button>
              <button class="ctrl-btn" id="btn-end" title="Final">⏭</button>
            </div>
          </div>
          <div class="viewer-moves-col">
            <div class="moves-panel-header">Movimentos</div>
            <div class="moves-list"><table class="moves-table" id="moves-table"></table></div>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>

<!-- Modal: Nova Partida -->
<div id="new-game-overlay" class="modal-overlay">
  <div class="modal-dialog">
    <div class="modal-header">
      <h2 class="modal-title">Nova Partida</h2>
      <button class="modal-close" id="new-game-close">✕</button>
    </div>
    <form id="new-game-form" class="modal-body">
      <div class="auth-field">
        <label class="auth-label">Nome da Partida</label>
        <input id="new-game-nome" type="text" class="auth-input" placeholder="Ex: Carlsen vs Nepo, Rd 6" required />
      </div>
      <div class="auth-field">
        <label class="auth-label">PGN</label>
        <textarea id="new-game-pgn" class="auth-input" rows="6" placeholder="1. e4 e5 2. Nf3 ..." required></textarea>
      </div>
      <button type="submit" class="auth-submit">Salvar Partida</button>
    </form>
  </div>
</div>

<!-- Toast Notification -->
<div id="toast"></div>

<!-- Scripts -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/chess-engine.js"></script>
<script src="js/games-viewer.js"></script>
<script src="js/games.js"></script>
<script src="js/main.js"></script>

</body>
</html>
