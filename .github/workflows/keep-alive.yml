name: Keep Render Awake

on:
  schedule:
    - cron: '*/10 * * * *'   # a cada 10 minutos
  workflow_dispatch:          # permite rodar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" --max-time 60 https://chess-vault.onrender.com/auth/health
